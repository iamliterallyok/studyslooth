<script>
if (localStorage.getItem("darkmode")) {} else {
  localStorage.setItem("darkmode", "0");
}
arrayOfPictureNames = ["home", "study", "play", "sets", "create", "import", "settings"];
if (localStorage.getItem("darkmode") == "1") {
  moveslider(0);
  document.body.style.backgroundColor = "black";
  document.getElementById("heading").style.backgroundColor = "white";
  document.getElementById("sidebar").style.outline = "3dvh solid white";
  document.getElementById("sidebar").style.backgroundColor = "black";
  document.getElementById("logo").style.filter = "invert(1)";
  for (i = 0; i < document.getElementsByClassName("hpimg").length; i++) {
    if (document.getElementsByClassName("hyperlink")[i].classList.contains("selected")) {
      document.getElementsByClassName("hyperlink")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.color = "black";
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i] + "black.png";
    } else {
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i] + "selected.png";
      document.getElementsByClassName("hyperlink")[i].classList.add("darkmodehyperlink");
    }
  }
}
setTimeout(setalltransitions, 10);
function setalltransitions() {
  document.body.style.transition = "0.8s background-color";
  document.getElementById("heading").style.transition = "0.8s background-color";
  document.getElementById("sidebar").style.transition = "0.8s outline-color, 0.8s background-color";
  document.getElementsByClassName("body4")[0].style.transition = "0.8s color";
  document.getElementById("logo").style.transition = "0.8s filter";
  document.getElementById("copyrightnotice").style.transition = "0.8s filter";
  for (i = 0; i < document.getElementsByClassName("sslider").length; i++) {
    document.getElementsByClassName("lilc")[i].style.transition = "0.8s left, 0.8s background-color";
    document.getElementsByClassName("sslider")[i].style.transition = "0.8s background-color, 0.8s outline-color";
  }
  for (i = 0; i < document.getElementsByClassName("hyperlink").length; i++) {
    document.getElementsByClassName("hyperlink")[i].style.transition = "0.8s background-color";
    document.getElementsByClassName("hplabel")[i].style.transition = "0.8s background-color, 0.8s color";
    document.getElementsByClassName("hpimg")[i].style.transition = "0.8s filter";
  }
}
allsliders = [false];
function moveslider(index2u) {
  if (allsliders[index2u] == true) {
    allsliders[index2u] = false;
    document.getElementsByClassName("sslider")[index2u].style.backgroundColor = "#efefef";
    document.getElementsByClassName("lilc")[index2u].style.backgroundColor = "black";
    document.getElementsByClassName("lilc")[index2u].style.left = "0.25lvh";
    if (index2u == 0) {
      localStorage.setItem("darkmode", "0");
      for (i = 0; i < allsliders.length; i++) {
        if (allsliders[i] == false) {
          document.getElementsByClassName("sslider")[i].style.backgroundColor = "#efefef";
          document.getElementsByClassName("lilc")[i].style.backgroundColor = "black";
        }
      }
      document.getElementById("copyrightnotice").style.filter = "invert(0)";
      for (i = 0; i < document.getElementsByClassName("sslider").length; i++) {
        document.getElementsByClassName("sslider")[i].style.outlineColor = "black";
      }
      document.getElementsByClassName("body4")[0].style.color = "black";
      document.body.style.backgroundColor = "white";
      document.getElementById("heading").style.backgroundColor = "#ff8500";
      document.getElementById("sidebar").style.outline = "3dvh solid #ff8500";
      document.getElementById("sidebar").style.backgroundColor = "white";
      document.getElementById("logo").style.filter = "invert(0)";
      for (i = 0; i < document.getElementsByClassName("hpimg").length; i++) {
        if (document.getElementsByClassName("hyperlink")[i].classList.contains("selected")) {
          document.getElementsByClassName("hyperlink")[i].style.backgroundColor = "#ff8500";
          document.getElementsByClassName("hplabel")[i].style.backgroundColor = "#ff8500";
          document.getElementsByClassName("hplabel")[i].style.color = "white";
          document.getElementsByClassName("hpimg")[i].style.filter = "brightness(1)";
        } else {
          document.getElementsByClassName("hpimg")[i].style.filter = "brightness(1) invert(0)"
          document.getElementsByClassName("hyperlink")[i].classList.remove("darkmodehyperlink");
        }
      }
    }
  } else {
    allsliders[index2u] = true;
    document.getElementsByClassName("sslider")[index2u].style.backgroundColor = "#ff8500";
    document.getElementsByClassName("lilc")[index2u].style.backgroundColor = "white";
    document.getElementsByClassName("lilc")[index2u].style.left = "3.75lvh";
    if (index2u == 0) {
      localStorage.setItem("darkmode", "1");
      for (i = 0; i < allsliders.length; i++) {
        if (allsliders[i] == false) {
          document.getElementsByClassName("sslider")[i].style.backgroundColor = "#3a3a3a";
          document.getElementsByClassName("lilc")[i].style.backgroundColor = "white";
        }
      }
      document.getElementById("copyrightnotice").style.filter = "invert(1)";
      for (i = 0; i < document.getElementsByClassName("sslider").length; i++) {
        document.getElementsByClassName("sslider")[i].style.outlineColor = "white";
      }
      document.getElementsByClassName("body4")[0].style.color = "white";
      document.body.style.backgroundColor = "black";
      document.getElementById("heading").style.backgroundColor = "white";
      document.getElementById("sidebar").style.outline = "3dvh solid white";
      document.getElementById("sidebar").style.backgroundColor = "black";
      document.getElementById("logo").style.filter = "invert(1)";
      for (i = 0; i < document.getElementsByClassName("hpimg").length; i++) {
        if (document.getElementsByClassName("hyperlink")[i].classList.contains("selected")) {
          document.getElementsByClassName("hyperlink")[i].style.backgroundColor = "white";
          document.getElementsByClassName("hplabel")[i].style.backgroundColor = "white";
          document.getElementsByClassName("hplabel")[i].style.color = "black";
          document.getElementsByClassName("hpimg")[i].style.filter = "brightness(0)";
        } else {
          document.getElementsByClassName("hpimg")[i].style.filter = "brightness(0) invert(1)"
          document.getElementsByClassName("hyperlink")[i].classList.add("darkmodehyperlink");
        }
      }
    }
  }
}

</script>

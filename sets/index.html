<script>
if (localStorage.getItem("darkmode")) {} else {
  localStorage.setItem("darkmode", "0");
}
arrayOfPictureNames = ["home", "study", "play", "sets", "create", "import", "settings"];
if (localStorage.getItem("darkmode") == "1") {
  document.getElementById("nameofset").style.color = "black";
  document.getElementById("disclaimer").style.backgroundColor = "black";
  document.getElementById("disclaimer").style.color = "white";
  document.body.style.backgroundColor = "#3a3a3a";
  document.getElementById("createnew").style.outlineColor = "white";
  document.getElementById("createnew").style.color = "white";
  document.getElementById("addnew").style.filter = "brightness(0) invert(1)";
  document.getElementById("heading").style.backgroundColor = "white";
  document.getElementById("sidebar").style.outline = "3lvh solid white";
  document.getElementById("sidebar").style.backgroundColor = "black";
  document.getElementById("creambackground").style.backgroundColor = "#3a3a3a";
  for (i = 0; i < 4; i++) {
    document.getElementsByClassName("creamsicle")[i].style.backgroundColor = "#3a3a3a";
  }
  document.getElementById("topcreamthing").style.backgroundImage = "linear-gradient(#3a3a3a, rgba(0,0,0,0))";
  document.getElementById("bottomcreamthing").style.backgroundImage = "linear-gradient(rgba(0,0,0,0), #3a3a3a)";
  document.getElementById("creambackground").style.opacity = "0.5";
  for (i = 0; i < document.getElementsByClassName("hpimg").length; i++) {
    if (document.getElementsByClassName("hyperlink")[i].classList.contains("selected")) {
      document.getElementsByClassName("hyperlink")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.color = "black";
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i].concat("black.png");
    } else {
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i].concat("selected.png");
      document.getElementsByClassName("hyperlink")[i].classList.add("darkmodehyperlink");
    }
  }
}
if (parseInt(localStorage.getItem("numofsets")) > 0) {
for (i = 1; i <= parseInt(localStorage.getItem("numofsets")); i++) {
  creategroup(i.toString());
}
if (parseInt(localStorage.getItem("numofsets")) == 10) {
  document.getElementById("createnew").remove();
}
} else {
  document.getElementById("disclaimer").remove();
  document.getElementById("createnew").classList.add("full");
}
function redirect(url, lsat) {
  sessionStorage.setItem("lsa", lsat);
  window.location.href = url;
}
function creategroup(n2c) {
  nDiv = document.createElement("div");
  nDiv.classList.add("group");
  nDiv.classList.add("grpfilter");
  nDiv.setAttribute("onclick", `redirect("../sets/set.html", ${n2c})`);
  nbgimg = document.createElement("div");
  nbgimg.classList.add("bgimg");
  nbgimg.style.backgroundImage = `url("${localStorage.getItem(n2c + "p")}")`;
  document.getElementById("groups").insertBefore(nDiv, document.getElementById("createnew"));
  nDiv2 = document.createElement("div");
  nDiv2.id = "naa";
  nDiv.appendChild(nDiv2);
  nDiv.appendChild(nbgimg);
  nsp1 = document.createElement("span");
  nsp1.classList.add("big");
  nsp1.innerHTML = localStorage.getItem(n2c + "n");
  nDiv2.appendChild(nsp1);
  nDiv2.appendChild(document.createElement("br"));
  nsp2 = document.createElement("span");
  nsp2.classList.add("small");
  nsp2.innerHTML = localStorage.getItem(n2c + "a");
  nDiv2.appendChild(nsp2);
}
if (localStorage.getItem("darkmode") == "1") {
ll = document.getElementsByClassName("group").length;
for (i = 0; i < ll; i++) {
  document.getElementsByClassName("group")[i].classList.add("groupdarkmode");
  document.getElementsByClassName("group")[i].classList.remove("grpfilter");
}
}
adjustgradients(document.getElementById("evenbggroups"));
document.getElementById("evenbggroups").addEventListener("scroll", function() {
  adjustgradients(document.getElementById("evenbggroups"));
});
function adjustgradients(elementtu) {
  if (elementtu.scrollTop > 0) {
    document.getElementById("topcreamthing").classList.remove("hidden");
  } else {
    document.getElementById("topcreamthing").classList.add("hidden");
  }
  if (Math.floor(elementtu.scrollHeight) - 10 > Math.floor(elementtu.scrollTop + elementtu.offsetHeight)) {
    document.getElementById("bottomcreamthing").classList.remove("hidden");
  } else {
    document.getElementById("bottomcreamthing").classList.add("hidden");
  }
}
</script>

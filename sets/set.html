<script>
{
  sessionStorage.setItem("lsa", "3");
  /*
  localStorage.setItem("3n", "six seven");
  localStorage.setItem("3a", "kichael");
  localStorage.setItem("3p", "https://images.unsplash.com/photo-1709688061860-a76fd6c26beb?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");
  */
}
if (sessionStorage.getItem("lsa")) {
  current = sessionStorage.getItem("lsa");
} else {
  window.location.href = "../sets/setnotfound.html"
}
if (localStorage.getItem("darkmode")) {} else {
  localStorage.setItem("darkmode", "0");
}
document.getElementById("bgimg").style.backgroundImage = `url("${localStorage.getItem(current + "p")}")`;
document.getElementById("fadedbg").style.backgroundImage = `url("${localStorage.getItem(current + "p")}")`;
document.getElementById("nameofset").innerHTML = localStorage.getItem(current + "n");
document.getElementsByClassName("txtarea")[0].value = localStorage.getItem(current + "n");
document.getElementsByClassName("txtarea")[1].value = localStorage.getItem(current + "a");
arrayOfPictureNames = ["home", "study", "play", "sets", "create", "import", "settings"];
if (localStorage.getItem("darkmode") == "1") {
  document.body.style.backgroundColor = "black";
  document.getElementById("heading").style.backgroundColor = "white";
  document.getElementById("sidebar").style.outline = "3lvh solid white";
  document.getElementById("sidebar").style.backgroundColor = "black";
  document.getElementById("nameofset").style.color = "black";
  document.getElementById("creambackground").style.backgroundColor = "#3a3a3a";
  document.getElementsByClassName("buttonth")[2].classList.add("dmm");
  document.getElementsByClassName("buttonth")[3].classList.add("dmm");
  for (i = 0; i < 4; i++) {
    document.getElementsByClassName("creamsicle")[i].style.backgroundColor = "#3a3a3a";
  }
  document.getElementById("creambackground").style.opacity = "0.5";
  document.body.style.backgroundColor = "#3a3a3a";
  for (i = 0; i < document.getElementsByClassName("hpimg").length; i++) {
    if (document.getElementsByClassName("hyperlink")[i].classList.contains("selected")) {
      document.getElementsByClassName("hyperlink")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.backgroundColor = "white";
      document.getElementsByClassName("hplabel")[i].style.color = "black";
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i].concat("black.png");
    } else {
      document.getElementsByClassName("hpimg")[i].src = "../media/images/toolbar/" + arrayOfPictureNames[i].concat("selected.png");
      document.getElementsByClassName("hyperlink")[i].classList.add("darkmodehyperlink");
    }
  }
}
document.getElementsByClassName("txtarea")[0].addEventListener("keydown", function() {
  setTimeout(function() {
    if (document.getElementsByClassName("txtarea")[0].value != "") {
      localStorage.setItem(current + "n", document.getElementsByClassName("txtarea")[0].value);
    }
    document.getElementById("nameofset").innerHTML = document.getElementsByClassName("txtarea")[0].value;
  }, 10);
});
document.getElementsByClassName("txtarea")[1].addEventListener("keydown", function() {
  setTimeout(function() {
    if (document.getElementsByClassName("txtarea")[1].value != "") {
      localStorage.setItem(current + "a", document.getElementsByClassName("txtarea")[1].value);
    }
  }, 10);
});
function download() {
  qaaa = "";
  for (i = 1; i < (parseInt(localStorage.getItem(current.concat("qat"))) + 1); i++) {
    qaaa = qaaa.concat(localStorage.getItem(current.concat("q", i.toString())), "\\\\\\", localStorage.getItem(current.toString().concat("a", i.toString())), "\\\\\\");
  }
  var blob = new Blob([localStorage.getItem(current.concat("n")).concat("[]", localStorage.getItem(current.concat("a")), "[]", localStorage.getItem(current.concat("p")), "[]", qaaa)], {
    type: "text/plain;charset=utf-8",
    });
  saveAs(blob, localStorage.getItem(current.concat("n")).concat(".studyslooth"));
}
function deleteset() {
  for (i = (parseInt(current) + 1); i < 11; i++) {
    localStorage.setItem((i - 1).toString().concat("bt"), localStorage.getItem(i.toString().concat("bt")));
    localStorage.setItem((i - 1).toString().concat("n"), localStorage.getItem(i.toString().concat("n")));
    localStorage.setItem((i - 1).toString().concat("a"), localStorage.getItem(i.toString().concat("a")));
    localStorage.setItem((i - 1).toString().concat("qat"), localStorage.getItem(i.toString().concat("qat")));
    localStorage.setItem((i - 1).toString().concat("p"), localStorage.getItem(i.toString().concat("p")));
    localStorage.setItem((i - 1).toString().concat("wqc"), localStorage.getItem(i.toString().concat("wqc")));
    if (localStorage.getItem(localStorage.getItem(i.toString().concat("whiteboardrecommended")))) {
      localStorage.setItem((i - 1).toString().concat("whiteboardrecommended"), localStorage.getItem(i.toString().concat("whiteboardrecommended")));
    } else {
      localStorage.removeItem((i - 1).toString().concat("whiteboardrecommended"));
    }
    if (localStorage.getItem(localStorage.getItem(i.toString().concat("terms")))) {
      localStorage.setItem((i - 1).toString().concat("terms"), localStorage.getItem(i.toString().concat("terms")));
    } else {
      localStorage.removeItem((i - 1).toString().concat("terms"));
    }
    if (localStorage.getItem(localStorage.getItem(i.toString().concat("chronological")))) {
      localStorage.setItem((i - 1).toString().concat("chronological"), localStorage.getItem(i.toString().concat("chronological")));
    } else {
      localStorage.removeItem((i - 1).toString().concat("chronological"));
    }
    for (a = 1; a <= parseInt(localStorage.getItem(i.toString().concat("qat"))); a++) {
      localStorage.setItem((i - 1).toString().concat("q", a.toString()), localStorage.getItem(i.toString().concat("q", a.toString())));
      localStorage.setItem((i - 1).toString().concat("a", a.toString()), localStorage.getItem(i.toString().concat("a", a.toString())));
    }
  }
  localStorage.setItem("numofsets", (parseInt(localStorage.getItem("numofsets")) - 1).toString());
  window.location.href = "../../sets/";
}
</script>

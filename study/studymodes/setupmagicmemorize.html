function buildinrec(wloa, arrtu) {
  document.getElementsByClassName("listoa")[wloa].innerHTML = "";
  startingpoint = 4 + ((7-steps.length)/2) * 8;
  for (i = 0; i < arrtu.length; i++) {
    ndv = document.createElement("div");
    ndv.classList.add("auxpls");
    ndv.classList.add("auxplsrec");
    if (localStorage.getItem("darkmode") == "1") {
    ndv.classList.add("aprdm");
    } else {
    ndv.classList.add("aprlm");
    }
    if (itsaword.indexOf(arrtu[i]) == -1 && wloa == 0) {
    ndv.innerHTML = neww[arrtu[i]];
    } else if (itsaword.indexOf(arrtu[i]) != -1) {
    ndv.innerHTML = itsawordnames[itsaword.indexOf(arrtu[i])];
    } else {
    ndv.innerHTML = arrtu[i];
    }
    ndv.style.top = startingpoint + (i * 8) + "dvh";
    randomrotation = 4 - Math.floor(Math.random() * 9);
    randomstart = Math.floor(Math.random() * 300);
    setTimeout(makebright, randomstart, ndv);
    ndv.style.transform = `translate(-50%, -50%) rotateZ(${randomrotation}deg)`;
    document.getElementsByClassName("listoa")[wloa].appendChild(ndv);
  }
}
function makebright(itemmm) {
  itemmm.style.opacity = 1;
}
function remINX(indextr) {
  newwtypes[indextr] = [];
  newwdifs[indextr] = -1;
}
function calcbest(diff) {
  indexshg = [];
  scoreshg = [];
  for (i = 0; i < neww.length; i++) {
    if (diff.indexOf(newwdifs[i]) != -1) {
      hgdim = 0;
      for (a = 0; a < newwtypes[i].length; a++) {
        if (newwprf.indexOf(newwtypes[i][a]) == -1) {
          hgdim-=0.5;
        } else {
          hgdim+=1;
        }
      }
      indexshg.push(i);
      scoreshg.push(hgdim);
    }
  }
  if (indexshg.length == 0) {
    return false;
  } else {
    bgbg = -Infinity;
    bgbgINX = -1;
    for (b = 0; b < scoreshg.length; b++) {
      if (scoreshg[b] > bgbg) {
        bgbg = scoreshg[b];
        bgbgINX = indexshg[b];
      }
    }
    if (bgbgINX == -1) {
      return false;
    } else {
      return bgbgINX;
    }
  }
}

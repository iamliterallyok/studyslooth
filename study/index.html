    }

function showpopup(nameofgame) {

      redirecttoads('hotseatauditory');

      redirecttoads('hotseatmultiplayer');
      } else if (tog3 == 1) {
      redirecttoads('hotseattrueorfalse');
      } else {
      redirecttoads('hotseat');

function creategroup(n2c) {
  nn2c = "";
  for (f = 0; f < n2c.length; f++) {
    if (n2c[f] != " " && n2c[f] != "-" && n2c[f] != "&") {
      nn2c = nn2c + n2c[f].toLowerCase();
    }
  }
  nDiv = document.createElement("div");
  nDiv.classList.add("group");
  nDiv.classList.add("group1");
  nDiv.classList.add("grpfilter");
  switch (nn2c.substring(0, 5).toLowerCase()) {
    case "hotse":
      nDiv.setAttribute("onclick", "showpopup('hotseat')");
      break;
    case "match":
      nDiv.setAttribute("onclick", "showpopup('matching')");
      break;
    case "expla":
      if (localStorage.getItem(current.concat("whiteboardrecommended")) == "1") {
      nDiv.setAttribute("onclick", "showpopup('explain')");
      } else {
      nDiv.setAttribute("onclick", "redirecttoads('explain')");
      }
      break;
    case "reada":
      nDiv.setAttribute("onclick", "showpopup('readand')");
      break;
    case "unscr":
      nDiv.setAttribute("onclick", "showpopup('unscramble')");
      break;
    case "useno":
      nDiv.setAttribute("onclick", "showpopup('usenotes')");
      break;
    default:
      nDiv.setAttribute("onclick", "redirecttoads('".concat(nn2c.toLowerCase(), "')"));
      break;
  }
  nbgimg = document.createElement("div");
  nbgimg.classList.add("bgimg");
  nbgimg.style.backgroundImage = `url("../media/images/studymode/${nn2c}bg.png")`;
  document.getElementById("groups").insertBefore(nDiv, document.getElementById("createnew"));
  nDiv2 = document.createElement("div");
  nDiv2.id = "naa";
  nDiv.appendChild(nDiv2);
  nDiv.appendChild(nbgimg);
  nsp1 = document.createElement("span");
  nsp1.classList.add("big");
  nsp1.innerHTML = n2c.toUpperCase();
  nDiv2.appendChild(nsp1);
  nDiv2.appendChild(document.createElement("br"));
}

}
